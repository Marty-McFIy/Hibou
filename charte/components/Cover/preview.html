<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hibou</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--fond); color:var(--texte); font-family:var(--font-texte); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .nuit { fill:var(--nuit); } .ardoise { fill:var(--ardoise); } .ambre { fill:var(--ambre); } .brume { fill:var(--brume); } .pierre { fill:var(--pierre); }
  [data-theme="nuit"] .slab { fill:var(--ardoise); } [data-theme="nuit"] .ard { fill:var(--surface-haute); }
  .blk { rx:var(--rayon-lg); } .blk-xl { rx:var(--rayon-xl); }
  .words { position:absolute; left:var(--espace-6); bottom:var(--espace-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-titre); font-size:120px; line-height:.92; font-weight:600; color:var(--texte); }
  .tag { margin:var(--espace-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--texte-doux); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      nuit 208×248 (la nuit, la plus grande) · ardoise 136×176 · brume 104×112 bord droit · ambre 104×40 seul, petit et vif (55/25/12/6 de la charte)
  arrangement une haute dalle de nuit avec satellites, pieds alignés à espace-6 du bas, gouttières espace-4, brume qui déborde à droite
  pattern     paires de disques (le regard) : « une seule couleur vive, celle des yeux » — iris ambre r=10 et pupilles r=4.5 du symbole, 3 paires sur la dalle, 1 paire évidée dans la brume
  scales      côtés en multiples de espace-2 ; gouttières espace-4 ; pas des paires espace-7 ; coins rayon-lg, rayon-xl pour la dalle
-->
<rect class="nuit slab blk-xl" x="24" y="16" width="208" height="248" rx="22"/>
<rect class="ardoise ard blk" x="248" y="88" width="136" height="176" rx="14"/>
<rect class="brume blk" x="400" y="152" width="104" height="112" rx="14"/>
<rect class="ambre blk" x="400" y="96" width="104" height="40" rx="14"/>
<circle class="ambre" cx="96" cy="72" r="10"/><circle class="ambre" cx="128" cy="72" r="10"/>
<circle class="nuit" cx="96" cy="72" r="4.5"/><circle class="nuit" cx="128" cy="72" r="4.5"/>
<circle class="ambre" cx="144" cy="136" r="10"/><circle class="ambre" cx="176" cy="136" r="10"/>
<circle class="nuit" cx="144" cy="136" r="4.5"/><circle class="nuit" cx="176" cy="136" r="4.5"/>
<circle class="ambre" cx="80" cy="200" r="10"/><circle class="ambre" cx="112" cy="200" r="10"/>
<circle class="nuit" cx="80" cy="200" r="4.5"/><circle class="nuit" cx="112" cy="200" r="4.5"/>
<circle class="nuit" cx="436" cy="208" r="10"/><circle class="nuit" cx="468" cy="208" r="10"/>
<circle class="ambre" cx="436" cy="208" r="4.5"/><circle class="ambre" cx="468" cy="208" r="4.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Hibou</h1>
<p class="tag">L'IA qui veille chez vous. Locale, isolée, discrète.</p>
</div>
</div>
</body>
</html>

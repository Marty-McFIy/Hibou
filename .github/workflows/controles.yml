name: Contrôles
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe et erreurs du script
        run: |
          bash -n hibou
          shellcheck -S error hibou
      - name: Python des amorces et du miroir
        run: python3 -m py_compile hibou-miroir.py $(find amorces -name '*.py')
      - name: JSON des amorces
        run: for f in $(find amorces charte -name '*.json'); do python3 -m json.tool "$f" >/dev/null || { echo "JSON invalide : $f"; exit 1; }; done
      - name: Services embarqués (autotests)
        run: |
          bash -c 'source <(sed -n "/^source_relecteur() {/,/^}/p" hibou); source_relecteur' | HIBOU_AUTOTEST=1 python3 -
          bash -c 'source <(sed -n "/^source_priorite() {/,/^}/p" hibou); source_priorite' | HIBOU_AUTOTEST=1 python3 -
      - name: Cohérence des réglages (hibou autotest)
        run: NO_COLOR=1 ./hibou autotest
